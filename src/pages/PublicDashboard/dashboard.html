<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Public Dashboard - GraphQL Data</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #f5f6fa;
      color: #2d3436;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 40px 20px;
    }

    .dashboard {
      width: 100%;
      max-width: 640px;
    }

    .dashboard__header {
      text-align: center;
      margin-bottom: 32px;
    }

    .dashboard__title {
      font-size: 28px;
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 8px;
    }

    .dashboard__subtitle {
      font-size: 14px;
      color: #636e72;
    }

    .card {
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
      padding: 24px;
      margin-bottom: 20px;
    }

    .card--loading {
      display: none;
      text-align: center;
      padding: 48px 24px;
    }

    .card--loading.card--visible {
      display: block;
    }

    .card--error {
      display: none;
      background: #fff5f5;
      border: 1px solid #feb2b2;
      color: #c53030;
    }

    .card--error.card--visible {
      display: block;
    }

    .card--data {
      display: none;
    }

    .card--data.card--visible {
      display: block;
    }

    .spinner {
      display: inline-block;
      width: 40px;
      height: 40px;
      border: 4px solid #e2e8f0;
      border-top-color: #4299e1;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      margin-top: 16px;
      font-size: 14px;
      color: #718096;
    }

    .error-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .error-message {
      font-size: 14px;
      line-height: 1.6;
    }

    .error-detail {
      margin-top: 8px;
      padding: 8px 12px;
      background: #fff;
      border-radius: 6px;
      font-family: "SF Mono", "Fira Code", monospace;
      font-size: 13px;
      color: #718096;
      word-break: break-all;
    }

    .post-list {
      list-style: none;
    }

    .post-list__item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 0;
      border-bottom: 1px solid #f0f0f0;
    }

    .post-list__item:last-child {
      border-bottom: none;
    }

    .post-list__id {
      flex-shrink: 0;
      width: 32px;
      height: 32px;
      background: #ebf4ff;
      color: #3182ce;
      font-size: 12px;
      font-weight: 700;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .post-list__title {
      font-size: 15px;
      font-weight: 500;
      color: #2d3748;
    }

    .post-count {
      font-size: 13px;
      color: #a0aec0;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <div class="dashboard">
    <header class="dashboard__header">
      <h1 class="dashboard__title">Public Dashboard</h1>
      <p class="dashboard__subtitle">GraphQL Public Data Feed</p>
    </header>

    <div id="loading-card" class="card card--loading card--visible">
      <div class="spinner"></div>
      <p class="loading-text">Loading posts...</p>
    </div>

    <div id="error-card" class="card card--error">
      <p class="error-title">Failed to Load Data</p>
      <p class="error-message" id="error-message"></p>
      <p class="error-detail" id="error-detail" style="display: none;"></p>
    </div>

    <div id="data-card" class="card card--data">
      <p class="post-count" id="post-count"></p>
      <ul class="post-list" id="post-list"></ul>
    </div>
  </div>

  <script type="module">
    import { ApolloClient, InMemoryCache, gql } from 'https://esm.sh/@apollo/client@3.11.10/core/index.js';

    const GET_PUBLIC_DATA_QUERY = gql`
      query GetPublicData {
        posts {
          id
          title
        }
      }
    `;

    const client = new ApolloClient({
      uri: 'https://api.example.com/graphql',
      cache: new InMemoryCache()
    });

    const loadingCard = document.getElementById('loading-card');
    const errorCard = document.getElementById('error-card');
    const dataCard = document.getElementById('data-card');
    const errorMessage = document.getElementById('error-message');
    const errorDetail = document.getElementById('error-detail');
    const postList = document.getElementById('post-list');
    const postCount = document.getElementById('post-count');

    function showLoading() {
      loadingCard.classList.add('card--visible');
      errorCard.classList.remove('card--visible');
      dataCard.classList.remove('card--visible');
    }

    function showError(message, detail) {
      loadingCard.classList.remove('card--visible');
      errorCard.classList.add('card--visible');
      dataCard.classList.remove('card--visible');
      errorMessage.textContent = message;
      if (detail) {
        errorDetail.style.display = 'block';
        errorDetail.textContent = detail;
      } else {
        errorDetail.style.display = 'none';
      }
    }

    function showData(posts) {
      loadingCard.classList.remove('card--visible');
      errorCard.classList.remove('card--visible');
      dataCard.classList.add('card--visible');

      postCount.textContent = `${posts.length} post${posts.length !== 1 ? 's' : ''} loaded`;

      postList.innerHTML = '';
      posts.forEach(function(post) {
        var li = document.createElement('li');
        li.className = 'post-list__item';
        li.innerHTML =
          '<span class="post-list__id">' + post.id + '</span>' +
          '<span class="post-list__title">' + escapeHtml(post.title) + '</span>';
        postList.appendChild(li);
      });
    }

    function escapeHtml(text) {
      var div = document.createElement('div');
      div.appendChild(document.createTextNode(text));
      return div.innerHTML;
    }

    async function fetchData() {
      try {
        var result = await client.query({ query: GET_PUBLIC_DATA_QUERY });
        var posts = result.data.posts;
        if (!posts || !Array.isArray(posts)) {
          showError('Unexpected response format', 'The "posts" field is missing or not an array.');
          return;
        }
        showData(posts);
      } catch (err) {
        var message = 'An unexpected error occurred while fetching data.';
        var detail = '';
        if (err.networkError) {
          message = 'Network error: Unable to reach the GraphQL endpoint.';
          detail = err.networkError.message || String(err.networkError);
        } else if (err.graphQLErrors && err.graphQLErrors.length > 0) {
          message = 'GraphQL error returned from the server.';
          detail = err.graphQLErrors.map(function(e) { return e.message; }).join('; ');
        } else if (err.message) {
          detail = err.message;
        }
        showError(message, detail);
      }
    }

    fetchData();
  </script>
</body>
</html>
