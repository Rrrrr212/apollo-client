<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Public Dashboard</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: #f5f7fb;
        color: #1f2937;
      }

      main {
        max-width: 720px;
        margin: 48px auto;
        padding: 32px;
        background: #ffffff;
        border-radius: 16px;
        box-shadow: 0 18px 40px rgba(15, 23, 42, 0.08);
      }

      h1 {
        margin: 0 0 12px;
        font-size: 2rem;
      }

      p {
        margin: 0;
        color: #4b5563;
      }

      .status {
        margin-top: 20px;
        padding: 12px 16px;
        border-radius: 10px;
        font-size: 0.95rem;
      }

      .status.loading {
        background: #eff6ff;
        color: #1d4ed8;
      }

      .status.error {
        background: #fef2f2;
        color: #b91c1c;
      }

      .status.empty {
        background: #f9fafb;
        color: #6b7280;
      }

      ul {
        margin: 24px 0 0;
        padding-left: 20px;
      }

      li {
        margin: 10px 0;
        line-height: 1.5;
      }

      .post-id {
        color: #6b7280;
        font-size: 0.9rem;
        margin-left: 8px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>GraphQL 公开数据看板</h1>
      <p>使用 Apollo Client 从公开 GraphQL 端点拉取并展示文章列表。</p>
      <div id="status" class="status loading">正在加载公开数据...</div>
      <ul id="post-list" hidden></ul>
    </main>

    <script type="module">
      import {
        ApolloClient,
        InMemoryCache,
        HttpLink,
        gql,
      } from "https://cdn.jsdelivr.net/npm/@apollo/client/+esm";

      const statusElement = document.getElementById("status");
      const postListElement = document.getElementById("post-list");

      const client = new ApolloClient({
        link: new HttpLink({
          uri: "https://api.example.com/graphql",
        }),
        cache: new InMemoryCache(),
      });

      const GET_PUBLIC_DATA_QUERY = gql`
        query GetPublicData {
          posts {
            id
            title
          }
        }
      `;

      function showStatus(message, type) {
        statusElement.textContent = message;
        statusElement.className = `status ${type}`;
        statusElement.hidden = false;
      }

      function renderPosts(posts) {
        postListElement.replaceChildren();

        posts.forEach((post) => {
          const listItem = document.createElement("li");
          const title = document.createElement("strong");
          const id = document.createElement("span");

          title.textContent = post.title || "未命名文章";
          id.textContent = `#${post.id}`;
          id.className = "post-id";

          listItem.append(title, id);
          postListElement.appendChild(listItem);
        });

        postListElement.hidden = false;
        statusElement.hidden = true;
      }

      async function loadPublicData() {
        showStatus("正在加载公开数据...", "loading");

        try {
          const { data } = await client.query({
            query: GET_PUBLIC_DATA_QUERY,
            fetchPolicy: "network-only",
          });

          const posts = data?.posts ?? [];

          if (posts.length === 0) {
            postListElement.hidden = true;
            showStatus("当前没有可展示的公开数据。", "empty");
            return;
          }

          renderPosts(posts);
        } catch (error) {
          postListElement.hidden = true;
          showStatus(`加载失败：${error.message}`, "error");
        }
      }

      loadPublicData();
    </script>
  </body>
</html>
