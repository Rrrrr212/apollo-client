name: Types Check

on: pull_request

permissions:
  contents: read

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  types-check:
    name: GraphQL Types Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@de0fac2e4500dabe0009c67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ">=23.6.0"

      - run: npm ci

      - name: Generate GraphQL types
        run: npm run gen:types

      - name: Check for uncommitted changes
        run: |
          if [ -n "$(git diff --name-only src/graphql/generated.ts)" ]; then
            echo "::error::GraphQL generated types are out of date. Run 'npm run gen:types' and commit the changes."
            git diff src/graphql/generated.ts
            exit 1
          fi
