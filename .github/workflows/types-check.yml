name: Check GraphQL Types

on:
  pull_request:
    branches:
      - main
      - master

jobs:
  check-types:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate types
        run: npm run gen:types

      - name: Check for uncommitted changes
        run: |
          if [[ -n "$(git status --porcelain src/graphql/generated.ts)" ]]; then
            echo "Error: The generated types are out of sync with the schema."
            echo "Please run 'npm run gen:types' locally and commit the updated src/graphql/generated.ts."
            git diff src/graphql/generated.ts
            exit 1
          fi
